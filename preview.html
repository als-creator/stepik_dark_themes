<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Stepik Dark Themes — Превью палитр</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #111; color: #ccc; padding: 32px; }
  h1 { margin: 0 0 4px; font-size: 24px; color: #eee; }
  .sub { margin: 0 0 28px; font-size: 14px; color: #888; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card { border-radius: 10px; padding: 18px; border: 1px solid rgba(255,255,255,.12); }
  .card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .card .src { font-size: 11px; opacity: .6; margin: 0 0 14px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .swatch { width: 26px; height: 26px; border-radius: 5px; border: 1px solid rgba(255,255,255,.2); position: relative; }
  .swatch::after { content: attr(data-name); position: absolute; top: 30px; left: 50%; transform: translateX(-50%); font-size: 9px; white-space: nowrap; color: inherit; opacity: .5; display: none; }
  .swatch:hover::after { display: block; }
  .row { display: flex; flex-direction: column; gap: 4px; }
  .row span { display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(255,255,255,.15); }
  .code-demo { margin-top: 12px; padding: 12px; border-radius: 6px; font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 12px; line-height: 1.6; }
  .kw { font-weight: 700; }
  .cm { font-style: italic; }
  .fn { }
  .st { }
  .nu { }
  .ty { }
</style>
</head>
<body>
  <h1>Stepik Dark Themes</h1>
  <p class="sub">Stepik Night / Night Deep · Catppuccin (Mocha/Macchiato/Frappe) · Kate (Breeze Dark / Oblivion) · Linux.org.ru (Tango) — палитры для stepik.org</p>
  <div class="grid" id="grid"></div>
<script>
const themes = [
  {
    id: 'stepik-night', name: 'Stepik Night (фирменная)', src: 'официальная ночная тема stepik.org',
    palette: {
      bg: '#141525', bgAlt: '#1F1F2F', panel: '#282B41', panel2: '#353547',
      border: '#3F3F3F', border2: '#535366', fg: '#EEEEF0', fg2: '#AFAEC4', fg3: '#8E8EA3', fgMuted: '#66667A',
      accent: '#66CC66', accent2: '#7888EE', blue: '#56A4FF', danger: '#FF7A65', warning: '#FFD481', success: '#83D683'
    },
    code: { bg: '#262A3E', gutter: '#202335', fg: '#E8E9F0', comment: '#9092A3', kw: '#98A0E8', st: '#8FDC8F', nu: '#FFB86C', fn: '#79C0FF', ty: '#FFD481' }
  },
  {
    id: 'stepik-night-deep', name: 'Stepik Night Deep', src: 'официальная ночная тема stepik.org (тёмный вариант)',
    palette: {
      bg: '#0C0D17', bgAlt: '#151621', panel: '#1E1F2C', panel2: '#2C2D40',
      border: '#34354C', border2: '#424359', fg: '#F2F2F7', fg2: '#C0C1D5', fg3: '#9B9CB4', fgMuted: '#8A8BA3',
      accent: '#6FCF6F', accent2: '#808EF4', blue: '#5DA3FF', danger: '#FF8070', warning: '#FFD98C', success: '#8FDC8F'
    },
    code: { bg: '#222438', gutter: '#1A1C29', fg: '#EEEEF4', comment: '#8B8CA0', kw: '#A5ACF3', st: '#94E7A0', nu: '#FFBE7A', fn: '#85C6FF', ty: '#FFDD99' }
  },
  {
    id: 'catppuccin-mocha', name: 'Catppuccin Mocha', src: 'linux.org.ru · Catppuccin (тёмная серия)',
    palette: {
      bg: '#1e1e2e', bgAlt: '#181825', panel: '#181825', panel2: '#313244',
      border: '#45475a', border2: '#585b70', fg: '#cdd6f4', fg2: '#bac2de', fg3: '#a6adc8', fgMuted: '#6c7086',
      accent: '#a6e3a1', accent2: '#cba6f7', blue: '#89b4fa', danger: '#f38ba8', warning: '#f9e2af', success: '#a6e3a1'
    },
    code: { bg: '#28293B', gutter: '#1E1E2E', fg: '#cdd6f4', comment: '#8E92A4', kw: '#f5c2e7', st: '#a6e3a1', nu: '#fab387', fn: '#89b4fa', ty: '#f9e2af' }
  },
  {
    id: 'catppuccin-macchiato', name: 'Catppuccin Macchiato', src: 'linux.org.ru · Catppuccin (тёмная серия)',
    palette: {
      bg: '#24273a', bgAlt: '#1e2030', panel: '#1e2030', panel2: '#363a4f',
      border: '#494d64', border2: '#5b6078', fg: '#cad3f5', fg2: '#b8c0e0', fg3: '#a5adcb', fgMuted: '#6e738d',
      accent: '#a6da95', accent2: '#c6a0f6', blue: '#8aadf4', danger: '#ed8796', warning: '#eed49f', success: '#a6da95'
    },
    code: { bg: '#2B2E42', gutter: '#24273A', fg: '#cad3f5', comment: '#9397AB', kw: '#f5bde6', st: '#a6da95', nu: '#f5a97f', fn: '#8aadf4', ty: '#eed49f' }
  },
  {
    id: 'catppuccin-frappe', name: 'Catppuccin Frappe', src: 'linux.org.ru · Catppuccin (тёмная серия)',
    palette: {
      bg: '#303446', bgAlt: '#292c3c', panel: '#292c3c', panel2: '#414559',
      border: '#51576d', border2: '#626880', fg: '#c6d0f5', fg2: '#b5bfe2', fg3: '#a5adce', fgMuted: '#737994',
      accent: '#a6d189', accent2: '#ca9ee6', blue: '#8caaee', danger: '#e78284', warning: '#e5c890', success: '#a6d189'
    },
    code: { bg: '#383B4E', gutter: '#303446', fg: '#c6d0f5', comment: '#A3A7B8', kw: '#f4b8e4', st: '#a6d189', nu: '#ef9f76', fn: '#8caaee', ty: '#e5c890' }
  },
  {
    id: 'kate-breeze-dark', name: 'Kate Breeze Dark', src: 'редактор Kate (KSyntaxHighlighting)',
    palette: {
      bg: '#232629', bgAlt: '#202225', panel: '#2a2e32', panel2: '#31363b',
      border: '#3f4347', border2: '#3a3f44', fg: '#cfcfc2', fg2: '#a5a6a8', fg3: '#7a7c7d', fgMuted: '#7a7c7d',
      accent: '#27ae60', accent2: '#8e44ad', blue: '#3daee9', danger: '#da4453', warning: '#fdbc4b', success: '#27ae60'
    },
    code: { bg: '#2F3339', gutter: '#292D31', fg: '#cfcfc2', comment: '#9A9C9C', kw: '#efc9a0', st: '#F67373', nu: '#FA7600', fn: '#D3A8E6', ty: '#53A4D9' }
  },
  {
    id: 'kate-oblivion', name: 'Kate Oblivion', src: 'редактор Kate (GtkSourceView)',
    palette: {
      bg: '#201f1f', bgAlt: '#1a1919', panel: '#2e3436', panel2: '#302f2f',
      border: '#3c3a3a', border2: '#787775', fg: '#d3d7c1', fg2: '#eeeeec', fg3: '#e0dedb', fgMuted: '#787775',
      accent: '#8ae234', accent2: '#ad7fa8', blue: '#729fcf', danger: '#e85848', warning: '#fce94f', success: '#4e9a06'
    },
    code: { bg: '#2A2A2A', gutter: '#222222', fg: '#d3d7c1', comment: '#53A506', kw: '#ffffff', st: '#edd400', nu: '#fce94f', fn: '#729fcf', ty: '#5A95DA' }
  },
  {
    id: 'linuxorg', name: 'Linux.org.ru (Tango)', src: 'linux.org.ru, тёмная тема (палитра Tango)',
    palette: {
      bg: '#2e3436', bgAlt: '#262b2c', panel: '#262b2c', panel2: '#3a4143',
      border: '#555753', border2: '#6b6f6b', fg: '#d3d7cf', fg2: '#babdb6', fg3: '#9fa29c', fgMuted: '#7d807b',
      accent: '#8ae234', accent2: '#ad7fa8', blue: '#729fcf', danger: '#ef2929', warning: '#fcaf3e', success: '#8ae234'
    },
    code: { bg: '#343A3C', gutter: '#2C3234', fg: '#babdb6', comment: '#9EA4AF', kw: '#CE8AE2', st: '#98c379', nu: '#d19a66', fn: '#61aeee', ty: '#e6c07b' }
  }
];

const grid = document.getElementById('grid');
themes.forEach(t => {
  const s = t.palette;
  const c = t.code;
  const card = document.createElement('div');
  card.className = 'card';
  card.style.background = s.bg;
  card.style.color = s.fg;
  card.innerHTML = `
    <h2 style="color:${s.fg}">${t.name}</h2>
    <p class="src" style="color:${s.fg3}">${t.src}</p>
    <div class="swatches">
      <span class="swatch" style="background:${s.bg}" data-name="bg"></span>
      <span class="swatch" style="background:${s.panel2}" data-name="panel2"></span>
      <span class="swatch" style="background:${s.border}" data-name="border"></span>
      <span class="swatch" style="background:${s.border2}" data-name="border2"></span>
      <span class="swatch" style="background:${s.fg3}" data-name="fg3"></span>
      <span class="swatch" style="background:${s.fg}" data-name="fg"></span>
    </div>
    <div class="row">
      <span><span class="dot" style="background:${s.accent}"></span>accent</span>
      <span><span class="dot" style="background:${s.accent2}"></span>accent2</span>
      <span><span class="dot" style="background:${s.blue}"></span>blue (actions)</span>
      <span><span class="dot" style="background:${s.danger}"></span>danger</span>
      <span><span class="dot" style="background:${s.warning}"></span>warning</span>
      <span><span class="dot" style="background:${s.success}"></span>success</span>
    </div>
    <div class="code-demo" style="background:${c.bg};color:${c.fg};border:1px solid ${s.border}">
      <span class="cm"># ${t.name} — CodeMirror</span><br>
      <span class="kw" style="color:${c.kw}">function</span>
      <span class="fn" style="color:${c.fn}">greet</span>(<span style="color:${c.fg}">name</span>) {<br>
      &nbsp;&nbsp;<span class="kw" style="color:${c.kw}">const</span>
      <span style="color:${c.fg}">msg</span> =
      <span class="st" style="color:${c.st}">"Hello, "</span> +
      <span style="color:${c.fg}">name</span>; <span class="cm" style="color:${c.comment}">// ${c.fg} primary</span><br>
      &nbsp;&nbsp;<span class="kw" style="color:${c.kw}">return</span>
      <span style="color:${c.fg}">msg</span>.<span class="fn" style="color:${c.fn}">length</span> +
      <span class="nu" style="color:${c.nu}">42</span>;
      }
    </div>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
